services:
  - type: web
    name: shynliapartmentcleaning
    runtime: static
    buildCommand: node scripts/prepare-onrender-redirect.mjs
    staticPublishPath: ./redirect-origin
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex
    routes:
      - type: rewrite
        source: /*
        destination: https://shynlicom.onrender.com/__apartment_redirect/*
